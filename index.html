<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de Responsabilidad - Salidas de Campo UTP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para renderizar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib para modificar el PDF y estampar los textos físicamente -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .draggable-text {
            touch-action: none;
            cursor: move;
            user-select: none;
            background: transparent;
            border: 2px dashed rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Formato de Responsabilidad - Salidas de Campo</h1>
        <p class="text-sm text-gray-600 mb-6">Medicina Veterinaria - UTP</p>

        <!-- Datos del Estudiante -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-gray-50 border border-gray-200 rounded-lg">
            <div>
                <label class="block text-sm font-bold text-gray-800">Nombre del estudiante</label>
                <input type="text" id="input-nombre" placeholder="Ej: Juan Pérez" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2.5 text-base bg-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-800">Documento de identidad</label>
                <input type="text" id="input-documento" placeholder="Ej: 1098765432" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2.5 text-base bg-white">
            </div>
        </div>

        <!-- Buscador Interactivo de Materia -->
        <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg relative">
            <label class="block text-sm font-bold text-blue-900 mb-2">Selecciona o busca la Materia / Asignatura:</label>
            <input type="text" id="input-materia" placeholder="Escribe para buscar materia..." autocomplete="off" class="block w-full rounded-md border-gray-300 shadow-sm border p-2.5 bg-white focus:ring-blue-500 focus:border-blue-500 text-base">
            
            <!-- Lista desplegable de sugerencias -->
            <ul id="lista-sugerencias" class="absolute z-10 left-4 right-4 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto hidden mt-1"></ul>
            
            <!-- Mensaje de advertencia en rojo -->
            <p id="error-materia" class="text-red-600 text-xs font-semibold mt-2 hidden">⚠️ Debes seleccionar una materia válida de la lista sugerida.</p>
        </div>

        <!-- Subida de PDF -->
        <div class="mb-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg">
            <label class="block text-sm font-medium text-gray-700 mb-2">Sube tu archivo PDF (Formato de Responsabilidad):</label>
            <input type="file" id="file-input" accept="application/pdf" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0
                file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer">
        </div>

        <!-- Formulario de Textos Dinámicos con Calendario -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block text-sm font-bold text-gray-800">1. Lugar de destino</label>
                <input type="text" id="input-1" placeholder="Ej: Finca La Suiza" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2.5 text-base">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-800">2. Fecha de salida</label>
                <input type="date" id="input-2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2.5 text-base bg-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-800">3. Fecha de llegada</label>
                <input type="date" id="input-3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2.5 text-base bg-white">
            </div>
        </div>

        <!-- Contenedor del PDF con etiquetas transparentes -->
        <div class="relative inline-block border border-gray-300 rounded-lg overflow-hidden bg-gray-50 mb-6 max-w-full overflow-x-auto" id="pdf-container">
            <canvas id="pdf-canvas" class="block mx-auto"></canvas>
            
            <div id="drag-1" class="draggable-text absolute text-blue-900 px-3 py-1.5 rounded-md text-base font-bold shadow-sm hidden" style="left: 50px; top: 50px;">Lugar de destino</div>
            <div id="drag-2" class="draggable-text absolute text-green-900 px-3 py-1.5 rounded-md text-base font-bold shadow-sm hidden" style="left: 50px; top: 100px;">Fecha de salida</div>
            <div id="drag-3" class="draggable-text absolute text-purple-900 px-3 py-1.5 rounded-md text-base font-bold shadow-sm hidden" style="left: 50px; top: 150px;">Fecha de llegada</div>
        </div>

        <!-- Botón Guardar -->
        <div>
            <button id="btn-guardar" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition text-lg">
                Generar PDF, Subir y Guardar URL
            </button>
        </div>

        <!-- Resultado de la URL -->
        <div id="resultado-url" class="mt-4 hidden p-4 bg-green-50 border border-green-200 rounded-lg">
            <p class="text-sm font-medium text-green-800">¡Formato guardado con éxito!</p>
            <a id="link-pdf" href="#" target="_blank" class="text-blue-600 underline text-sm break-all font-semibold">Ver PDF Online</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://obcwirxjvypxdpxudyqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_nFUde6igy8iYfKScAMFhKQ_K1e7ot-d';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let archivoOriginalArrayBuffer = null;
        let nombreArchivoActual = '';
        let materiaValidaSeleccionada = "";
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        // Función para formatear fecha de YYYY-MM-DD a DD/MM/YYYY
        function formatearFecha(fechaStr) {
            if (!fechaStr) return "";
            const partes = fechaStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return fechaStr;
        }

        // Lista oficial de materias
        const materias = [
            "Fisiología de la reproducción", "Reproducción", "Producción bovina", 
            "Producción equina", "MIGA", "Cirugía II", "Semiología", 
            "Introducción a la zootecnia", "Producción porcina", "Salud pública", 
            "Fisiopatología", "Nutrición", "Biología", "Producción piscícola", "Especies menores"
        ];

        // Buscador Predictivo
        const inputMateria = document.getElementById('input-materia');
        const listaSugerencias = document.getElementById('lista-sugerencias');
        const errorMateria = document.getElementById('error-materia');

        inputMateria.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            materiaValidaSeleccionada = ""; 
            listaSugerencias.innerHTML = '';

            if (query === '') {
                listaSugerencias.classList.add('hidden');
                errorMateria.classList.remove('hidden');
                return;
            }

            const filtradas = materias.filter(m => m.toLowerCase().includes(query));

            if (filtradas.length > 0) {
                listaSugerencias.classList.remove('hidden');
                filtradas.forEach(materia => {
                    const li = document.createElement('li');
                    li.textContent = materia;
                    li.className = "p-2.5 hover:bg-blue-100 cursor-pointer text-sm font-medium border-b border-gray-100 last:border-none";
                    li.addEventListener('click', () => {
                        inputMateria.value = materia;
                        materiaValidaSeleccionada = materia;
                        listaSugerencias.classList.add('hidden');
                        errorMateria.classList.add('hidden');
                    });
                    listaSugerencias.appendChild(li);
                });
            } else {
                listaSugerencias.classList.add('hidden');
                errorMateria.classList.remove('hidden');
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#input-materia') && !e.target.closest('#lista-sugerencias')) {
                listaSugerencias.classList.add('hidden');
                if (!materiaValidaSeleccionada) {
                    errorMateria.classList.remove('hidden');
                }
            }
        });

        // 1. Cargar PDF localmente
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                alert('Por favor selecciona un archivo PDF válido.');
                return;
            }

            nombreArchivoActual = file.name;
            const fileReader = new FileReader();

            fileReader.onload = function() {
                const rawBuffer = this.result;
                archivoOriginalArrayBuffer = rawBuffer.slice(0);
                const typedarray = new Uint8Array(rawBuffer.slice(0));

                pdfjsLib.getDocument(typedarray).promise.then(pdfDoc => {
                    return pdfDoc.getPage(1);
                }).then(page => {
                    const renderViewport = page.getViewport({ scale: 1.2 });
                    canvas.height = renderViewport.height;
                    canvas.width = renderViewport.width;
                    
                    page.render({ canvasContext: ctx, viewport: renderViewport });
                    document.querySelectorAll('.draggable-text').forEach(el => el.classList.remove('hidden'));
                });
            };
            fileReader.readAsArrayBuffer(file);
        });

        // 2. Sincronizar inputs
        const inputsConfig = [
            { idInput: 'input-1', idDrag: 'drag-1', defaultText: 'Lugar de destino', isDate: false },
            { idInput: 'input-2', idDrag: 'drag-2', defaultText: 'Fecha de salida', isDate: true },
            { idInput: 'input-3', idDrag: 'drag-3', defaultText: 'Fecha de llegada', isDate: true }
        ];

        inputsConfig.forEach(item => {
            const input = document.getElementById(item.idInput);
            const label = document.getElementById(item.idDrag);
            input.addEventListener('input', (e) => {
                let val = e.target.value;
                if (item.isDate && val) {
                    val = formatearFecha(val);
                }
                label.textContent = val || item.defaultText;
            });
        });

        // 3. Arrastre táctil y de mouse
        document.querySelectorAll('.draggable-text').forEach(el => {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            el.addEventListener('pointerdown', (e) => {
                isDragging = true;
                el.setPointerCapture(e.pointerId);
                initialX = el.offsetLeft;
                initialY = el.offsetTop;
                startX = e.clientX;
                startY = e.clientY;
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                el.style.left = `${initialX + (e.clientX - startX)}px`;
                el.style.top = `${initialY + (e.clientY - startY)}px`;
            });

            el.addEventListener('pointerup', (e) => {
                isDragging = false;
                el.releasePointerCapture(e.pointerId);
            });
        });

        // 4. Modificar PDF, subir a Storage y guardar en Supabase
        document.getElementById('btn-guardar').addEventListener('click', async () => {
            const nombreEstudiante = document.getElementById('input-nombre').value.trim();
            const documentoIdentidad = document.getElementById('input-documento').value.trim();

            if (!nombreEstudiante || !documentoIdentidad) {
                alert('Por favor completa el nombre y el documento de identidad del estudiante.');
                return;
            }

            if (!materiaValidaSeleccionada) {
                errorMateria.classList.remove('hidden');
                alert('Debe seleccionar una materia válida de las opciones sugeridas antes de continuar.');
                inputMateria.focus();
                return;
            }

            if (!archivoOriginalArrayBuffer) {
                alert('Por favor sube un archivo PDF primero.');
                return;
            }

            try {
                const bufferParaEditar = archivoOriginalArrayBuffer.slice(0);
                const pdfDoc = await PDFLib.PDFDocument.load(bufferParaEditar);
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];
                const { width: pdfWidth, height: pdfHeight } = firstPage.getSize();

                const canvasClientWidth = canvas.width;
                const canvasClientHeight = canvas.height;

                function calcularCoordenadasPDF(elemId) {
                    const el = document.getElementById(elemId);
                    const leftPx = parseInt(el.style.left);
                    const topPx = parseInt(el.style.top);

                    const x = (leftPx / canvasClientWidth) * pdfWidth;
                    const y = pdfHeight - ((topPx / canvasClientHeight) * pdfHeight) - 10;

                    return { x, y, leftPx, topPx };
                }

                const dest = document.getElementById('input-1').value;
                const pos1 = calcularCoordenadasPDF('drag-1');
                
                const fSalidaRaw = document.getElementById('input-2').value;
                const fSalida = formatearFecha(fSalidaRaw);
                const pos2 = calcularCoordenadasPDF('drag-2');
                
                const fLlegadaRaw = document.getElementById('input-3').value;
                const fLlegada = formatearFecha(fLlegadaRaw);
                const pos3 = calcularCoordenadasPDF('drag-3');

                // Estampar textos
                firstPage.drawText(dest, { x: pos1.x, y: pos1.y, size: 14 });
                firstPage.drawText(fSalida, { x: pos2.x, y: pos2.y, size: 14 });
                firstPage.drawText(fLlegada, { x: pos3.x, y: pos3.y, size: 14 });

                const pdfBytes = await pdfDoc.save();
                const blobPDF = new Blob([pdfBytes], { type: 'application/pdf' });

                const materiaLimpia = materiaValidaSeleccionada
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, '_');

                const fileName = `responsabilidad_${materiaLimpia}_${Date.now()}.pdf`;

                // Subir a Storage
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('pdfs')
                    .upload(fileName, blobPDF, {
                        contentType: 'application/pdf',
                        upsert: true
                    });

                if (uploadError) throw uploadError;

                // Obtener URL pública
                const { data: publicUrlData } = supabaseClient.storage
                    .from('pdfs')
                    .getPublicUrl(fileName);

                const urlPublica = publicUrlData.publicUrl;

                // Guardar en la tabla con los datos del estudiante
                const { error: dbError } = await supabaseClient
                    .from('documentos_editados')
                    .insert([{
                        nombre_archivo: nombreArchivoActual,
                        url_pdf: urlPublica,
                        materia: materiaValidaSeleccionada,
                        nombre_estudiante: nombreEstudiante,
                        documento_identidad: documentoIdentidad,
                        texto_apartado_1: dest,
                        pos_x_1: pos1.leftPx,
                        pos_y_1: pos1.topPx,
                        texto_apartado_2: fSalida,
                        pos_x_2: pos2.leftPx,
                        pos_y_2: pos2.topPx,
                        texto_apartado_3: fLlegada,
                        pos_x_3: pos3.leftPx,
                        pos_y_3: pos3.topPx
                    }]);

                if (dbError) throw dbError;

                document.getElementById('link-pdf').href = urlPublica;
                document.getElementById('link-pdf').textContent = urlPublica;
                document.getElementById('resultado-url').classList.remove('hidden');
                alert('¡Formato generado, subido al Storage y guardado con éxito!');

            } catch (error) {
                alert('Hubo un error: ' + error.message);
                console.error(error);
            }
        });
    </script>
</body>
</html>
